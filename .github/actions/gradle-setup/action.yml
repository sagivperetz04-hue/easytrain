name: Gradle setup
description: Installs JDK 17 and configures Gradle with a shared cache. Checkout happens in the job.

inputs:
  gradle-home-cache-cleanup:
    description: Whether Gradle should prune its cache before saving it.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: "17"

    - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/master' }}
        gradle-home-cache-cleanup: ${{ inputs.gradle-home-cache-cleanup }}
